<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Enhanced Page</title>
</head>
<body>
    <h1 id="heading">Welcome to My Static Page</h1>
    <p>This is a page enhanced with JavaScript.</p>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <script>
        // JavaScript to dynamically change the text of the heading
        document.getElementById('heading').innerText = 'Welcome to My JavaScript-Enhanced Page!';
    </script>
</body>
</html>
